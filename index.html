<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi des dossiers comptables</title>
<style>
:root{--ink:#172033;--ink2:#3a4458;--mut:#6b7488;--bg:#f2f4f8;--card:#fff;--line:#e4e8f0;--line2:#c9d0de;--acc:#3454d1;--acc2:#2742b0;--soft:#eaeefc;--ok:#1f8a5b;--warn:#c77700;--bad:#c93232;--chip:#f1f3f8;--chipink:#4a5469;--okbg:#e3f4ec;--warnbg:#fdf0d9;--hover:#fafbfd;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e6e9f2;--ink2:#c3c9d8;--mut:#98a1b5;--bg:#0f1420;--card:#181f2e;--line:#2a3347;--line2:#3a4560;--acc:#5b78f0;--acc2:#7a93f5;--soft:#222d57;--ok:#4cc38a;--warn:#f0a63a;--bad:#ff7a70;--chip:#232c40;--chipink:#b4bccd;--okbg:#17352a;--warnbg:#3a2d14;--hover:#1c2436;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#e6e9f2;--ink2:#c3c9d8;--mut:#98a1b5;--bg:#0f1420;--card:#181f2e;--line:#2a3347;--line2:#3a4560;--acc:#5b78f0;--acc2:#7a93f5;--soft:#222d57;--ok:#4cc38a;--warn:#f0a63a;--bad:#ff7a70;--chip:#232c40;--chipink:#b4bccd;--okbg:#17352a;--warnbg:#3a2d14;--hover:#1c2436;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14.5px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}

.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;transition:.18s}
.btn:hover{border-color:var(--line2);transform:translateY(-1px);box-shadow:0 3px 10px rgba(16,24,40,.08)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}

#q{min-width:360px}
dialog select[size]{padding:4px}
.sync{font-size:12.5px;color:var(--mut);font-weight:600}.sync.on{color:var(--ok)}
.ck{width:19px;height:19px;accent-color:var(--ok);cursor:pointer}
tr.done td{color:var(--mut);text-decoration:line-through}tr.done td:first-child,tr.done td:nth-child(3){text-decoration:none}
h2.grp{font-size:13px;text-transform:none;color:var(--mut);font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2.grp i{font-style:normal;background:var(--soft);color:var(--acc);border-radius:10px;padding:0 8px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

.chip{background:var(--chip);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600;color:var(--chipink)}.chip.col{background:var(--soft);color:var(--acc)}

table{border-collapse:collapse;width:100%}

td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}tbody tr:hover{background:var(--hover)}
td.note{white-space:pre-wrap;min-width:260px;color:var(--ink2)}

@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

@media(max-width:640px){main,header{padding-left:14px;padding-right:14px}dialog form{grid-template-columns:1fr}#q{min-width:0;width:100%}}
.tb,#ed{max-width:900px;margin-left:auto;margin-right:auto}
.tb{display:flex;flex-wrap:wrap;gap:3px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:12px;position:sticky;top:76px;z-index:4;box-shadow:0 2px 8px rgba(16,24,40,.06)}
.tb button,.tb select{border:1px solid transparent;background:none;border-radius:8px;min-width:32px;height:32px;padding:0 8px;cursor:pointer;font-weight:600}
.tb button:hover,.tb select:hover{background:var(--soft)}
.tb i{width:1px;height:22px;background:var(--line);margin:0 4px}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--line2);display:inline-block;vertical-align:middle}
.nst{margin-left:auto;color:var(--mut);font-size:12.5px;padding:0 8px}

#ed:empty:before{content:"Écris ici ce que tu as à faire cette semaine…";color:var(--mut)}
#ed h2{font-size:23px;margin:.7em 0 .3em;line-height:1.25}
#ed [style*="background-color"]{color:#172033}
#ed .tk{width:17px;height:17px;vertical-align:-3px;margin-right:4px;accent-color:var(--ok);cursor:pointer}
dialog .pkw{display:grid;gap:5px;color:var(--mut);font-size:12.5px;font-weight:700}
.pkin{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:0;background:var(--card);color:var(--ink);font-weight:400}
.pkin:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}
.pkin.ok{border-color:var(--ok);background:var(--okbg)}
.pkl{border:1px solid var(--line);border-radius:10px;max-height:210px;overflow:auto;background:var(--card)}
.pko{padding:9px 12px;cursor:pointer;color:var(--ink);font-weight:500;border-bottom:1px solid var(--line)}
.pko:last-child{border-bottom:0}.pko:hover,.pko.act{background:var(--soft)}.pko.sel{background:var(--acc);color:#fff}
.pkc{color:var(--ok);font-size:12.5px;font-weight:700;min-height:1.2em}
td a{color:var(--acc)}
.fl{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-weight:600;font-size:13px}
.sync .dt{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:0}
nav .ic,#mnu{display:none}
nav .lb{display:inline}
@media (max-width:800px){
  body{font-size:15px}
  header{padding:10px 14px;gap:10px;flex-wrap:nowrap;background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
  .brand{font-size:15px;flex:1;min-width:0;white-space:nowrap}
  #sync .st{display:none}
  #sync{font-size:12px}
  #mnu{display:inline-block;padding:6px 14px;font-size:18px;line-height:1}
  .tools{display:none;position:absolute;left:10px;right:10px;top:100%;margin:6px 0 0;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 14px 40px rgba(16,24,40,.22)}
  header.open .tools{display:flex}
  .tools .btn{text-align:left;padding:12px 14px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:7;border-radius:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);gap:0;box-shadow:0 -4px 18px rgba(16,24,40,.08)}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 1px;font-size:10.5px;position:relative;min-width:0}
  nav button.on{background:var(--soft);box-shadow:none}
  nav .ic{display:block;font-size:20px;line-height:1.2}
  nav .lg{display:none}
  #badge{position:absolute;top:0;right:12%;margin:0;font-size:10.5px;padding:0 6px}
  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom,0px))}
  .stats{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{padding:12px 14px}.stat b{font-size:22px}.stat span{font-size:12px}
  .bar{gap:8px;margin-bottom:12px}
  .bar>*{min-width:0}
  .bar .sp{display:none}
  .bar .btn.pri{order:-1;flex:1 1 100%;padding:13px;font-size:15px}
  .bar input.in-s,#q{flex:1 1 100%;min-width:0;width:100%}
  .bar select.in-s{flex:1 1 45%;max-width:none;width:auto}
  .bar label{font-size:12.5px}
  .filt select{max-width:none}
  .filt>*:not(.ft){display:none}
  .filt.open{display:grid;grid-template-columns:1fr 1fr}.filt.open>*{display:flex}.filt.open>.ft{grid-column:1/-1;display:flex;justify-content:space-between}.filt>.ft::after{float:none}.filt.open>.btn{grid-column:1/-1;justify-content:center}
  .bar>.fl{flex:1 1 45%}.bar>.fl.fw{flex:1 1 100%}
  .fl{flex-direction:column;align-items:stretch;gap:3px}.fl select,.fl input.in-s{color:var(--ink);font-weight:400}.fl select,.fl input.in-s{width:100%!important}
  .fl:has(#sdone){flex-direction:row;align-items:center}.fl #sdone{width:20px!important}
  .filt>.ft{flex:1 1 100%;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;color:var(--ink)}
  .filt>.ft::after{content:"▾";float:right;color:var(--mut)}.filt.open>.ft::after{content:"▴"}
  .stat{display:flex;align-items:baseline;gap:8px;padding:10px 14px}.stat b{font-size:20px;display:inline}.stat span{font-size:12px;line-height:1.25}
  .grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .card{padding:15px}.card:hover{transform:none}
  .panel{background:none;box-shadow:none;overflow:visible}
  table,tbody{display:block}thead{display:none}
  tbody tr{display:block;background:var(--card);border-radius:var(--r);box-shadow:0 1px 2px rgba(16,24,40,.07);padding:8px 14px;margin-bottom:10px}
  tbody tr:hover{background:var(--card)}
  tbody tr:has(td[colspan]){background:none;box-shadow:none;padding:0;margin:14px 0 6px}
  td{display:flex;gap:10px;align-items:baseline;padding:3px 0;border:0}
  td[data-l]::before{content:attr(data-l);flex:0 0 34%;max-width:120px;color:var(--mut);font-size:12px;font-weight:700}
  td.note{min-width:0;white-space:pre-wrap}
  td.act{justify-content:flex-end;gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
  td.act:empty{display:none}
  td>*:not(.btn){min-width:0;overflow-wrap:anywhere}

  .btn.sm{padding:8px 14px;font-size:13.5px}

  #ed{padding:18px 16px;min-height:55vh}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:92vw;text-align:center}
}
</style>

<body>
<header>
  <div class="brand"><div class="logo">€</div>Dossiers comptables</div>
  <nav>
    <button data-t="dos"><span class="ic">📁</span><span class="lb">Dossiers</span></button>
    <button data-t="sui"><span class="ic">📅</span><span class="lb">Suivi<span class="lg"> mensuel</span></span></button>
    <button data-t="rap"><span class="ic">🔔</span><span class="lb">Rappels</span><span id="badge"></span></button>
    <button data-t="fou"><span class="ic">🏢</span><span class="lb">Fournisseurs</span></button>
    <button data-t="not"><span class="ic">📝</span><span class="lb">Notes</span></button>
  </nav>
  <span id="sync" class="sync"></span>
  <span class="sync" style="font-weight:400;opacity:.7" title="Numéro de version du site">v5</span>
  <button class="btn" id="mnu" aria-label="Menu">⋯</button>
  <div class="tools">
    <button class="btn" data-x="menu">Envoyer vers Excel</button>
    <button class="btn" id="exp">Exporter la sauvegarde</button>
    <button class="btn" id="imp">Importer une sauvegarde</button>
  </div>
</header>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyqBD180oh6vwrmUiw1hHz1lN6zIAt4PfzxoLhqqZjOSD2k5LICVNjEaEAz44IBGYnv/exec", POLL = 4000; // URL « …/exec » fournie par Apps Script
const STATUTS = ["À faire", "En cours", "Fait"];
const RUBRIQUES = ["Réception des pièces", "Saisie comptable", "Rapprochement bancaire", "TVA", "Social", "Révision / bilan", "Relance client", "Autre"];
const LOGICIELS = ["Sage", "Ciel", "Quadra", "EBP", "Cegid", "Pennylane", "Tiime", "QuickBooks", "Excel"];
const DEPOTS = ["Email", "Portail client", "Plateforme du logiciel", "Clé USB", "Courrier", "Autre"];
const PERIODES = ["Mensuelle", "Trimestrielle", "Annuelle"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];

let D = { dossiers: [], suivi: [], rappels: [], notes: [], fournisseurs: [], faits: {} };
let DBX = false, readOnly = false, saving = false, ready = false, paused = false, ver = "", wgen = 0, pulling = false, lastErr = 0;
const CODE_DUREE_H = 24; // durée de validité du code mémorisé, en heures : le site le redemande ensuite
let code = localStorage.getItem("compta_code") || "", codeT = +localStorage.getItem("compta_code_t") || 0;
const codeExpire = () => { if (code && Date.now() - codeT > CODE_DUREE_H * 36e5) { code = ""; localStorage.removeItem("compta_code"); localStorage.removeItem("compta_code_t"); } };
const COLS = ["dossiers", "suivi", "rappels", "notes", "fournisseurs"], synced = { dossiers: {}, suivi: {}, rappels: {}, notes: {}, fournisseurs: {}, faits: {} };
const fid = k => String(k).replace(/\|/g, "_");
const migrer = () => { let ch = false; D.faits = D.faits || {}; D.dossiers.forEach(d => { if (!d.cree) { d.cree = iso(new Date()); ch = true; } }); if (ch) save(); };
const save = () => { wgen++; return persist().then(pull); };

function setSync(ok) { DBX = ok; const s = $("#sync"); if (s) { s.innerHTML = "<i class=dt></i><span class=st>" + (ok ? "Partagé, mise à jour en direct" : "Hors ligne, nouvelle tentative…") + "</span>"; s.title = ok ? "Connecté : les modifications sont partagées en direct" : "Hors ligne"; s.className = "sync" + (ok ? " on" : ""); } }
async function api(body) {
  if (!API.startsWith("http")) throw "config";
  codeExpire();
  if (!code) { code = (prompt("Code d'accès de l'équipe :") || "").trim(); if (!code) { paused = true; throw "code"; } codeT = Date.now(); localStorage.setItem("compta_code", code); localStorage.setItem("compta_code_t", codeT); }
  const j = await (await fetch(API, { method: "POST", body: JSON.stringify({ ...body, code }), signal: AbortSignal.timeout(25000) })).json();
  if (j.err) { if (j.err == "code") { code = ""; localStorage.removeItem("compta_code"); localStorage.removeItem("compta_code_t"); } throw j.err; }
  return j;
}
function diff() {
  const ops = [];
  COLS.forEach(col => {
    const cur = new Map(D[col].map(r => [String(r.id), r]));

  want.forEach((k, id) => { if (!synced.faits[id]) ops.push(["faits", id, JSON.stringify({ k })]); });

async function persist() {
  if (!ready || saving) return;

    let ops, sent = false;
    while ((ops = diff()).length) {

      ops.forEach(([c, id, js]) => { if (js === null) delete synced[c][id]; else synced[c][id] = c == "faits" ? 1 : js; });
      wgen++; setSync(true);

    }
    if (sent) toast("Enregistré ✓");
  } catch (e) {
    fail(e);
    if (e != "config" && e != "code" && Date.now() - lastErr > 20000) { lastErr = Date.now(); toast("Pas encore enregistré (" + ((e && e.message) || e) + "). Nouvelle tentative automatique…"); }
  } finally { saving = false; }
}
function fail(e) {
  if (e == "config") { if (!ready) $("#main").innerHTML = "<p class=empty>Configuration manquante : colle l'URL de ton application web Apps Script dans la constante API de index.html.</p>"; return; }
  if (e == "code") { toast("Code d'accès incorrect ou absent. Recharge la page pour le ressaisir."); paused = true; return; }
  setSync(false);
}
async function pull() {

    const j = await api({ a: "get", v: ver });
    setSync(true);
    // on ignore la réponse si tu as modifié quelque chose entre-temps ou si une fenêtre de saisie est ouverte :
    // elle écraserait ta modification ; la prochaine synchronisation la rattrapera
    if (saving || g !== wgen || diff().length || $("#dlg").open) return;

}
function applyData(j) {
  ver = j.v; if (!j.data) return;

  COLS.forEach(c => { D[c] = j.data[c] || []; synced[c] = Object.fromEntries(D[c].map(r => [String(r.id), JSON.stringify(r)])); });
  D.faits = {}; synced.faits = {};
  j.data.faits.forEach(k => { D.faits[k] = 1; synced.faits[fid(k)] = 1; });
  const first = !ready; ready = true;
  if (first) { migrer(); if (ech(jours).length && D.dossiers.length) tab = "rap"; render(); }
  else if (sig() !== before) refresh();
}

/* ---------- Échéances ---------- */
function ech(j, withDone = false) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const fin = new Date(t); fin.setDate(fin.getDate() + j);
  const lb = new Date(t); lb.setDate(lb.getDate() - 45);
  const out = [];
  const add = (dt, type, dos, txt, rid, key, did) => {
    const done = key ? !!D.faits[key] : !!(D.rappels.find(r => r.id == rid) || {}).fait;
    if (done && !withDone) return;
    out.push({ dt, type, dos, txt, rid, key, did, done, n: Math.round((dt - t) / 864e5) });
  };
  D.dossiers.forEach(d => {
    const c = d.cloture ? new Date(d.cloture + "T00:00") : null;
    const lbd = new Date(Math.max(lb, new Date((d.cree || iso(t)) + "T00:00")));
    if (d.tva && d.echeance) for (let k = -2; k < 14; k++) {
      const m = new Date(t.getFullYear(), t.getMonth() + k, 1), mo = m.getMonth();
      const ok = d.periodicite == "Mensuelle" || (d.periodicite == "Trimestrielle" && [0, 3, 6, 9].includes(mo)) ||
        (d.periodicite == "Annuelle" && c && mo == (c.getMonth() + 3) % 12);
      if (ok) { const dt = sd(m.getFullYear(), mo, d.echeance); if (dt >= lbd && dt <= fin) add(dt, "TVA " + d.periodicite.toLowerCase(), label(d), "Déclaration de TVA", null, `${d.id}|tva|${iso(dt)}`, d.id); }
    }
    if (c) {
      const f = new Date(t); f.setDate(f.getDate() + Math.max(j, 30));
      [-1, 0, 1].forEach(y => { const dt = sd(t.getFullYear() + y, c.getMonth(), c.getDate()); if (dt >= lbd && dt <= f) add(dt, "Clôture", label(d), "Clôture du dossier", null, `${d.id}|cloture|${iso(dt)}`, d.id); });
    }
  });
  D.rappels.filter(r => new Date(r.date + "T00:00") <= fin).forEach(r => {
    const d = D.dossiers.find(x => x.id == r.did);
    add(new Date(r.date + "T00:00"), "Rappel", d ? label(d) : "(général)", r.titre, r.id, undefined, r.did);
  });
  return out.sort((a, b) => a.dt - b.dt);
}

function ask(title, fields, vals = {}, check) {
  return new Promise(res => {
    const d = $("#dlg");
    d.innerHTML = `<form><h2>${title}</h2>` + fields.map(f => f.t == "chk"
      ? `<label class="chk ${f.full ? "full" : ""}"><input type=checkbox name=${f.k} ${vals[f.k] ? "checked" : ""}>${f.l}</label>`

      const f = fields.find(x => x.k == inp.dataset.for), sel = form.querySelector(`select[name=${f.k}]`);
      const fill = () => {
        const cur = sel.value, toks = norm(inp.value).split(/\s+/).filter(Boolean);
        const L = f.o.filter(o => { const a = ov(o); return a[0] === "" || toks.every(t => norm(a[2] ?? a[1]).includes(t)); });
        sel.innerHTML = L.map(o => { const [v, t] = ov(o); return `<option value="${esc(v)}" ${String(v) == cur ? "selected" : ""}>${esc(t)}</option>`; }).join("");
        if (sel.selectedIndex < 0 && sel.options.length) sel.selectedIndex = 0;
      };
      inp.oninput = fill; fill();
    });
    d.querySelectorAll("[data-pk]").forEach(inp => {
      const f = fields.find(x => x.k == inp.dataset.pk), hid = form.querySelector(`input[type=hidden][name=${f.k}]`), box = inp.parentNode.querySelector(".pkl"), msg = inp.parentNode.querySelector(".pkc"), O = f.o.map(ov);
      let shown = O, act = -1, typed = false;
      const mark = () => { const c = O.find(a => String(a[0]) === hid.value); inp.classList.toggle("ok", !!c && c[0] !== ""); msg.textContent = c && c[0] !== "" ? "✓ Sélectionné : " + c[1] : ""; };
      const draw = () => { box.innerHTML = shown.length ? shown.map((a, i) => `<div class="pko${hid.value !== "" && String(a[0]) === hid.value ? " sel" : ""}${i == act ? " act" : ""}" data-i=${i}>${esc(a[1])}</div>`).join("") : "<div class=pko style=cursor:default>Aucun résultat</div>"; box.hidden = false; if (act >= 0 && box.children[act]) box.children[act].scrollIntoView({ block: "nearest" }); };
      const pick = i => { const a = shown[i]; if (!a) return; hid.value = a[0]; inp.value = a[1]; typed = false; box.hidden = true; mark(); };
      inp.onfocus = inp.onclick = () => { if (!box.hidden) return; typed = false; shown = O; act = -1; draw(); inp.select(); };
      inp.oninput = () => {
        typed = true; hid.value = ""; mark();
        const toks = norm(inp.value).split(/\s+/).filter(Boolean);
        shown = O.filter(a => toks.every(t => norm(a[2] ?? a[1]).includes(t))); act = shown.length ? 0 : -1; draw();
      };
      inp.onkeydown = e => {
        if (e.key == "ArrowDown" || e.key == "ArrowUp") { e.preventDefault(); if (box.hidden) draw(); act = Math.max(0, Math.min(shown.length - 1, act + (e.key == "ArrowDown" ? 1 : -1))); draw(); }
        else if (e.key == "Enter" && !box.hidden) { e.preventDefault(); pick(act >= 0 ? act : 0); }
        else if (e.key == "Escape" && !box.hidden) { e.preventDefault(); e.stopPropagation(); box.hidden = true; }
      };
      inp.onblur = () => { box.hidden = true; };
      box.onmousedown = e => { e.preventDefault(); const o = e.target.closest("[data-i]"); if (o) pick(+o.dataset.i); };
      mark();
    });
    form.onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(form), v = {};
      fields.forEach(f => v[f.k] = f.t == "chk" ? (fd.get(f.k) ? 1 : 0) : (fd.get(f.k) || "").trim());
      const er = check && check(v);

      d.close(); res(v);

    d.oncancel = () => res(null);
    d.showModal();
  });
}

    <label class=fl>Statut<select id=ss class=in-s><option value="">Tous les statuts</option>${STATUTS.map(x => `<option ${x == curS ? "selected" : ""}>${x}</option>`).join("")}</select></label>
    <label class="fl fw">Collaborateur${selC("sc", curC)}</label><span class=sp></span><button class="btn pri" data-a=addS>+ Ajouter une rubrique</button></div>` +
    (L.length ? `<div class=panel><table><thead><tr><th>Date</th>${A_ ? "<th>Dossier</th>" : ""}<th>Statut</th><th>Détails / mises à jour</th><th>Dernière MAJ</th><th></th></tr></thead><tbody>` +
      L.map(s => `<tr><td data-l="Date" style="white-space:nowrap">${s.date ? fr(s.date) : s.mois}</td>${A_ ? `<td data-l="Dossier"><b>${esc(nom(s.did))}</b></td>` : ""}<td data-l="Statut"><select data-s=${s.id} class="sel s${STATUTS.indexOf(s.statut)}">${STATUTS.map(x => `<option ${x == s.statut ? "selected" : ""}>${x}</option>`).join("")}</select></td><td class=note data-l="Détails">${s.rub ? `<b>${esc(s.rub)}</b>${s.note ? " — " : ""}` : ""}${esc(s.note)}</td><td data-l="Dernière MAJ">${esc(s.maj)}</td><td class=act><button class="btn sm" data-a=edS data-id=${s.id}>Modifier</button> <button class="btn sm del" data-a=delS data-id=${s.id}>Supprimer</button></td></tr>`).join("") +
      `</tbody></table></div>` : `<p class=empty>Aucune mise à jour pour cette sélection. Clique sur « Ajouter une rubrique » pour en créer une.</p>`);
}

function vRap(it) {
  const order = ["TVA mensuelle", "TVA trimestrielle", "TVA annuelle", "Clôture", "Rappel"];
  const okCd = did => { const d = D.dossiers.find(z => z.id == did); return rcol == "__none" ? !(d && d.collab) : !!d && d.collab == rcol; };
  const tk = norm(qrap).split(/\s+/).filter(Boolean);
  const L = it.filter(x => (showDone || !x.done) && (!rcol || okCd(x.did)) && (!tk.length || tk.every(t => norm([x.type, x.dos, x.txt, fr(iso(x.dt))].join(" ")).includes(t))) && (!rtype || (rtype == "TVA" ? x.type.startsWith("TVA") : x.type == rtype)));
  if (rtri == "type") L.sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type) || a.dt - b.dt);
  else if (rtri == "dossier") L.sort((a, b) => cmp(a.dos, b.dos) || a.dt - b.dt);
  let last = "", rows = "";
  L.forEach(x => {
    if (rtri == "type" && x.type != last) { last = x.type; rows += `<tr><td colspan=7 style="background:var(--hover);font-weight:700;color:var(--acc)">${x.type} <span class=far>(${L.filter(y => y.type == x.type).length})</span></td></tr>`; }
    rows += `<tr${x.done ? " class=done" : ""}><td data-l="Fait"><input type=checkbox class=ck title="Marquer comme fait" ${x.done ? "checked" : ""} ${x.key ? `data-k="${esc(x.key)}"` : `data-r=${x.rid}`}></td><td data-l="Date">${fr(iso(x.dt))}</td><td data-l="Délai">${x.done ? "<span class=far>Fait ✓</span>" : delai(x.n)}</td><td data-l="Type">${x.type}</td><td data-l="Dossier">${esc(x.dos)}</td><td data-l="Détail">${esc(x.txt)}</td><td class=act>${x.rid ? `<button class="btn sm del" data-a=delR data-id=${x.rid}>Supprimer</button>` : ""}</td></tr>`;
  });
  const o = (v, t, cur) => `<option value="${v}" ${v == cur ? "selected" : ""}>${t}</option>`;
  return `<div class=bar><input id=qr class=in-s placeholder="Rechercher : une partie du dossier, du type, du détail…" value="${esc(qrap)}"><span class=sp></span><button class="btn pri" data-a=addR>+ Ajouter un rappel</button></div>
    <div class="bar filt${filOpen ? " open" : ""}"><label class=ft>Filtres et tri</label><label class=fl>Prochains jours<input type=number id=j min=1 max=365 value=${jours} class=in-s style="width:80px"></label>
    <label class=fl>Collaborateur${selC("rc", rcol)}</label><label class=fl>Type<select id=rt class=in-s>${o("", "Tous les types", rtype)}${o("TVA", "TVA (toutes)", rtype)}${o("Clôture", "Clôtures", rtype)}${o("Rappel", "Rappels personnels", rtype)}</select></label>
    <label class=fl>Trier par<select id=rs class=in-s>${o("date", "Date", rtri)}${o("type", "Type de rappel", rtri)}${o("dossier", "Dossier", rtri)}</select></label>
    <label class=fl style="cursor:pointer"><input type=checkbox id=sdone ${showDone ? "checked" : ""}>Afficher les faits</label></div>` +
    (L.length ? `<div class=panel><table><thead><tr><th style="width:50px">Fait</th><th>Date</th><th>Délai</th><th>Type</th><th>Dossier</th><th>Détail</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class=empty>Rien à signaler pour cette sélection dans les ${jours} prochains jours.</p>`) +
    `<p class=hint>Les échéances de TVA et de clôture sont calculées à partir des fiches dossier : annuelle = 3 mois après la clôture, trimestrielle = janvier, avril, juillet, octobre.</p>`;
}

function render() {
  setSync(DBX);
  if (!ready) { $("#main").innerHTML = "<p class=empty>Chargement des données partagées…</p>"; return; }
  const it = ech(jours, true), urg = it.filter(x => !x.done && x.n <= 3).length;
  document.title = (urg ? `(${urg}) ` : "") + "Suivi des dossiers comptables";
  $("#badge").textContent = urg || "";
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t == tab));
  $("#main").innerHTML = (readOnly ? '<p class=hint style="margin:0 0 14px;color:var(--warn);font-weight:600">Lecture seule : tu peux consulter les dossiers mais pas les modifier.</p>' : "") + { dos: vDos, sui: vSui, rap: () => vRap(it), not: vNot, fou: vFou }[tab]();
}

];

const FF = () => [
  { k: "did", l: "Client (dossier chez nous)", t: "dsel", o: [...D.dossiers].sort(byNum).map(d => [d.id, label(d), hay(d)]) },
  { k: "fournisseur", l: "Nom du fournisseur", t: "text", full: 1 },

const chkF = v => !v.did ? "Choisis le client dans la liste." : !v.fournisseur ? "Le nom du fournisseur est obligatoire." : "";
let qfou = "";
function vFou() {
  if (!D.dossiers.length) return `<p class=empty>Crée d'abord un dossier dans l'onglet « Dossiers ».</p>`;
  const toks = norm(qfou).split(/\s+/).filter(Boolean), cl = id => { const d = D.dossiers.find(x => x.id == id); return d ? label(d) : "(dossier supprimé)"; };
  const L = D.fournisseurs.filter(f => !toks.length || toks.every(t => norm([cl(f.did), f.fournisseur, f.ncli, f.mail, f.tel].join(" ")).includes(t)))
    .sort((a, b) => cmp(cl(a.did), cl(b.did)) || cmp(a.fournisseur, b.fournisseur));
  const mail = m => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m || "") ? `<a href="mailto:${esc(m)}">${esc(m)}</a>` : esc(m);
  return `<div class=bar><input id=qf class=in-s placeholder="Rechercher : client, fournisseur, n°, mail, téléphone…" value="${esc(qfou)}"><span class=sp></span><button class="btn pri" data-a=addF>+ Ajouter un contact fournisseur</button></div>` +

      L.map(f => `<tr><td data-l="Client"><b>${esc(cl(f.did))}</b></td><td data-l="Fournisseur">${esc(f.fournisseur)}</td><td data-l="N° client">${esc(f.ncli)}</td><td data-l="Mail">${mail(f.mail)}</td><td data-l="Téléphone">${esc(f.tel)}</td><td class=act><button class="btn sm" data-a=edF data-id=${f.id}>Modifier</button> <button class="btn sm del" data-a=delF data-id=${f.id}>Supprimer</button></td></tr>`).join("") +
      `</tbody></table></div>` : `<p class=empty>${D.fournisseurs.length ? "Aucun résultat pour cette recherche." : "Aucun contact fournisseur. Clique sur « Ajouter un contact fournisseur » pour en créer un."}</p>`);
}

const A = {
  async addF() { const v = await ask("Nouveau contact fournisseur", FF(), {}, chkF); if (v) D.fournisseurs.push({ id: nid(), did: +v.did, fournisseur: v.fournisseur, ncli: v.ncli, mail: v.mail, tel: v.tel, maj: now() }); },
  async edF(e) { const id = e.dataset.id, v = await ask("Modifier le contact fournisseur", FF(), D.fournisseurs.find(x => x.id == id), chkF), f = D.fournisseurs.find(x => x.id == id); if (v && f) Object.assign(f, { did: +v.did, fournisseur: v.fournisseur, ncli: v.ncli, mail: v.mail, tel: v.tel, maj: now() }); },
  async delF(e) { if (await oui("Supprimer ce contact fournisseur ?", "Supprimer")) D.fournisseurs = D.fournisseurs.filter(x => x.id != e.dataset.id); },
  resetF() { fil = {}; qs = ""; },
  async addD() { const v = await ask("Nouveau dossier", FD(), { periodicite: "Mensuelle" }, chkD); if (v) D.dossiers.push({ id: nid(), cree: iso(new Date()), ...v }); },
  async edD(e) { const id = e.dataset.id, v = await ask("Modifier le dossier", FD(), D.dossiers.find(x => x.id == id), chkD), d = D.dossiers.find(x => x.id == id); if (v && d) Object.assign(d, v); },
  async delD(e) { if (await oui("Supprimer ce dossier et tout son suivi ?", "Supprimer")) { const i = +e.dataset.id; D.dossiers = D.dossiers.filter(x => x.id != i); D.suivi = D.suivi.filter(x => x.did != i); D.rappels = D.rappels.filter(x => x.did != i); D.fournisseurs = D.fournisseurs.filter(x => x.did != i); } },
  async addS() {
    const v = await ask("Nouvelle rubrique", FS(), { did: curD == "all" ? "" : curD, date: iso(new Date()), statut: STATUTS[0] }, chkS);
    if (v) {
      D.suivi.push({ id: nid(), did: +v.did, date: v.date, mois: v.date.slice(0, 7), statut: v.statut, note: v.note, maj: now() });
      if (curD != "all" && curD != +v.did) curD = "all";
      if (curM != "Tous" && curM != v.date.slice(0, 7)) curM = "Tous";
    }
  },
  async edS(e) {
    const id = e.dataset.id, x0 = D.suivi.find(r => r.id == id), v = await ask("Modifier la rubrique", FS(), { ...x0, date: x0.date || x0.mois + "-01" }, chkS), x = D.suivi.find(r => r.id == id);
    if (v && x) Object.assign(x, { did: +v.did, date: v.date, mois: v.date.slice(0, 7), statut: v.statut, note: v.note, maj: now() });

  async delS(e) { if (await oui("Supprimer cette rubrique ?", "Supprimer")) D.suivi = D.suivi.filter(x => x.id != e.dataset.id); },
  async addR() {
    const opts = [["", "(général)"], ...[...D.dossiers].sort(byNum).map(d => [d.id, label(d), hay(d)])];
    const v = await ask("Nouveau rappel", [{ k: "titre", l: "Rappel", t: "text", full: 1 }, { k: "date", l: "Date", t: "date" }, { k: "did", l: "Dossier", t: "dsel", o: opts, full: 1 }], {},
      v => !v.titre || !v.date ? "Le texte et la date sont obligatoires." : "");
    if (v) D.rappels.push({ id: nid(), did: v.did ? +v.did : null, titre: v.titre, date: v.date, fait: 0 });
  },
  doneR(e) { D.rappels.find(x => x.id == e.dataset.id).fait = 1; },
  delR(e) { D.rappels = D.rappels.filter(x => x.id != e.dataset.id); }
};

/* ---------- Envoi vers Excel (copier-coller) ---------- */
const fx = s => s || ""; // dates AAAA-MM-JJ : comprises par Excel quelle que soit la langue
const dd = s => s.date || (s.mois + "-01");
const dn = id => { const d = D.dossiers.find(x => x.id == id) || {}; return d.numero || ""; };
const XL = {
  dos: ["Dossiers", () => [...D.dossiers].sort(byNum).map(d => [d.numero, d.nom, d.siret, d.tel, d.mail, d.logiciel, d.activite, fx(d.cloture), d.tva ? "Oui" : "Non", d.tva ? d.periodicite : "", d.tva ? d.echeance : "", d.depot, d.social ? "Oui" : "Non"])],
  sui: ["Suivi mensuel", () => [...D.suivi].sort((a, b) => cmp(dn(a.did), dn(b.did)) || dd(a).localeCompare(dd(b))).map(s => [dn(s.did), dd(s), s.statut, (s.rub ? s.rub + (s.note ? " : " : "") : "") + s.note, s.maj])],
  rap: ["Rappels", () => D.rappels.map(r => [fx(r.date), dn(r.did), r.titre, r.fait ? "Oui" : "Non"])],
  fou: ["Fournisseurs", () => D.fournisseurs.map(f => [dn(f.did), (D.dossiers.find(x => x.id == f.did) || {}).nom || "", f.fournisseur, f.ncli, f.mail, f.tel])]
};
async function copier(txt) {
  const host = $("#dlg").open ? $("#dlg") : document.body; // un champ hors de la fenêtre ouverte est bloqué par le navigateur
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.cssText = "position:fixed;left:0;top:0;opacity:0";
  host.appendChild(ta); ta.focus(); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  if (!ok && navigator.clipboard) { try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {} }
  return ok;
}
function menuXl() {
  const d = $("#dlg");
  d.innerHTML = `<form><h2>Envoyer vers Excel</h2>
    <p class="hint full" style="margin:0">Clique sur un bouton, ouvre ton fichier Excel, clique sur la cellule <b>A2</b> de la feuille indiquée et fais <b>Ctrl+V</b>. Commence par les dossiers.</p>
    <div class=xl>${Object.entries(XL).map(([k, [nom, f]]) => `<button type=button class=btn data-x=${k}>Copier ${f().length} ligne(s) → feuille « ${nom} »</button>`).join("")}</div>
    <div id=xlfb class=full></div>
    <div class=btns><button type=button class="btn pri" id=no>Fermer</button></div></form>`;
  $("#no").onclick = () => d.close();
  d.showModal();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-t]"), a = e.target.closest("[data-a]"), x = e.target.closest("[data-x]");
  if (t) { tab = t.dataset.t; const m = $("#main"); m.classList.remove("in"); void m.offsetWidth; m.classList.add("in"); render(); }
  else if (x) {
    if (x.dataset.x == "menu") return menuXl();
    const [nom, f] = XL[x.dataset.x];
    const txt = f().map(r => r.map(c => String(c ?? "").replace(/[\t\r\n]+/g, " ")).join("\t")).join("\r\n");
    const fb = $("#xlfb");
    if (await copier(txt)) {
      const m = `✓ Copié (${f().length} ligne(s)). Dans Excel : feuille « ${nom} », cellule A2, puis Ctrl+V.`;
      if (fb) fb.innerHTML = `<p style="margin:0;color:var(--ok);font-weight:600">${m}</p>`; else toast(m);
    } else if (fb) {
      fb.innerHTML = `<p class=hint style="margin:0 0 6px;color:var(--bad)">La copie automatique est bloquée par ton navigateur. Le texte est sélectionné ci-dessous : fais Ctrl+C, puis colle-le dans Excel (cellule A2 de la feuille « ${nom} »).</p><textarea readonly style="width:100%;height:110px;border:1px solid var(--line);border-radius:10px;padding:8px;font:12px monospace"></textarea>`;
      const t = fb.querySelector("textarea"); t.value = txt; t.focus(); t.select();
    }
  }
  else if (a && A[a.dataset.a]) { await A[a.dataset.a](a); save(); render(); }
});
document.addEventListener("change", e => {
  const x = e.target;
  if (x.id == "sd") curD = x.value == "all" ? "all" : +x.value;
  else if (x.id == "sm") curM = x.value;
  else if (x.id == "so") sortK = x.value;
  else if (x.id == "ss") curS = x.value;
  else if (x.id == "sc") curC = x.value;
  else if (x.id == "rc") rcol = x.value;
  else if (x.id == "rs") rtri = x.value;
  else if (x.id == "rt") rtype = x.value;
  else if (x.dataset.f) fil[x.dataset.f] = x.value;
  else if (x.id == "sdone") showDone = x.checked;
  else if (x.dataset.k) { if (x.checked) D.faits[x.dataset.k] = 1; else delete D.faits[x.dataset.k]; save(); }
  else if (x.dataset.r) { D.rappels.find(r => r.id == x.dataset.r).fait = x.checked ? 1 : 0; save(); }
  else if (x.id == "j") jours = Math.max(1, +x.value || 14);
  else if (x.dataset.s) { const s = D.suivi.find(r => r.id == x.dataset.s); s.statut = x.value; s.maj = now(); save(); }
  else return;
  render();
});
document.addEventListener("input", e => {
  const id = e.target.id, v = e.target.value;
  if (!["q", "qs", "qr", "qf"].includes(id)) return;
  if (id == "q") qs = v; else if (id == "qs") qsui = v; else if (id == "qf") qfou = v; else qrap = v;

/* ---------- Sauvegarde / import ---------- */
$("#exp").onclick = async () => {
  const txt = JSON.stringify(D, null, 1), name = "sauvegarde-comptabilite-" + iso(new Date()) + ".json";
  let dl = null; try { if (typeof claude !== "undefined" && claude.use) dl = await claude.use("downloads"); } catch (e) {}
  if (dl) { try { await dl.save({ filename: name, data: txt }); toast("Sauvegarde prête"); } catch (e) { if (!e || e.code != "declined") toast("Téléchargement impossible."); } return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" })); a.download = name; a.click(); toast("Sauvegarde téléchargée");
};
async function importer(txt) {
  let j; try { j = JSON.parse(txt); if (!Array.isArray(j.dossiers)) throw 0; } catch (x) { return toast("Fichier de sauvegarde invalide."); }
  const msg = DBX ? `Remplacer les données PARTAGÉES de tous les collaborateurs (${D.dossiers.length} dossier(s) actuellement) par cette sauvegarde (${j.dossiers.length} dossier(s)) ?`
    : `Remplacer les données actuelles par cette sauvegarde (${j.dossiers.length} dossiers) ?`;
  if (!(await oui(msg, "Remplacer"))) return;
  D = { dossiers: j.dossiers || [], suivi: j.suivi || [], rappels: j.rappels || [], notes: j.notes || [], fournisseurs: j.fournisseurs || [], faits: j.faits || {} };
  migrer(); save(); render(); toast("Sauvegarde importée : enregistrement en cours…");
}
function menuImp() {
  const d = $("#dlg");
  d.innerHTML = `<form><h2>Importer une sauvegarde</h2>
    <p class="hint full" style="margin:0">Choisis le fichier .json exporté depuis l'ancien site, ou colle son contenu dans la zone de texte.</p>

    <div class=btns><button type=button class=btn id=no>Annuler</button><button class="btn pri">Importer</button></div></form>`;
  $("#no").onclick = () => d.close();
  $("#impf").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $("#impt").value = r.result; }; r.readAsText(f); };
  d.querySelector("form").onsubmit = e => { e.preventDefault(); const t = $("#impt").value; d.close(); if (t.trim()) importer(t); else toast("Rien à importer."); };
  d.showModal();
}
$("#imp").onclick = menuImp;
$("#dlg").addEventListener("close", () => { if (pendingRender) { pendingRender = false; refresh(); } });

/* ---------- Notes (éditeur de texte riche partagé) ---------- */
let ntimer, rng, lastTyped = 0;
function majNote() { // met à jour la note affichée avec la version des autres, sans déplacer le curseur
  if (Date.now() - lastTyped < 5000) { setTimeout(() => { if (tab == "not") refresh(); }, 5000); return; }
  const ed = $("#ed"), n = D.notes[0], h = clean(n && n.html), s = getSelection();
  if (!ed || ed.innerHTML === h) return;
  let off = 0;
  if (s.rangeCount && ed.contains(s.anchorNode)) { const r = s.getRangeAt(0).cloneRange(); r.selectNodeContents(ed); r.setEnd(s.anchorNode, s.anchorOffset); off = r.toString().length; }
  ed.innerHTML = h;
  const w = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT); let nd;
  while ((nd = w.nextNode())) { if (off <= nd.length) { const r = document.createRange(); r.setStart(nd, off); r.collapse(true); s.removeAllRanges(); s.addRange(r); break; } off -= nd.length; }
}
const SZ = [["Petit", 2], ["Normal", 3], ["Grand", 5], ["Très grand", 6], ["Énorme", 7]];
const TB = [["bold", "<b>G</b>", "Gras"], ["italic", "<i>I</i>", "Italique"], ["underline", "<u>S</u>", "Souligné"], ["strikeThrough", "<s>B</s>", "Barré"], "|",
  ["hiliteColor", '<span class="sw" style="background:#fff176"></span>', "Surligner en jaune", "#fff176"], ["hiliteColor", '<span class="sw" style="background:#a5f3b5"></span>', "Surligner en vert", "#a5f3b5"], ["hiliteColor", '<span class="sw" style="background:#ffb3c1"></span>', "Surligner en rose", "#ffb3c1"], "|",
  ["foreColor", '<span style="color:#c93232">A</span>', "Texte rouge", "#c93232"], ["foreColor", '<span style="color:#3454d1">A</span>', "Texte bleu", "#3454d1"], ["foreColor", '<span style="color:#1f8a5b">A</span>', "Texte vert", "#1f8a5b"], "|", "SIZE", "|",
  ["formatBlock", "Titre", "Titre", "h2"], ["formatBlock", "¶", "Paragraphe normal", "p"], ["insertUnorderedList", "• Liste", "Liste à puces"], ["insertOrderedList", "1. Liste", "Liste numérotée"], ["check", "☑ Case", "Case à cocher"], "|",
  ["justifyLeft", "⇤", "Aligner à gauche"], ["justifyCenter", "↔", "Centrer"], ["removeFormat", "Effacer", "Effacer la mise en forme"], ["undo", "↶", "Annuler"], ["redo", "↷", "Rétablir"]];
function clean(h) {
  const t = document.createElement("template"); t.innerHTML = h || "";
  t.content.querySelectorAll("script,iframe,object,embed,style,link,meta,form").forEach(x => x.remove());
  t.content.querySelectorAll("*").forEach(el => [...el.attributes].forEach(a => {
    const n = a.name.toLowerCase(), v = a.value.toLowerCase();
    if (n.startsWith("on") || v.includes("javascript:") || (n == "style" && /url\(|expression/.test(v))) el.removeAttribute(a.name);
  }));
  return t.innerHTML;
}
function vNot() {
  const n = D.notes[0], bar = TB.map(b => b == "|" ? "<i></i>" : b == "SIZE"
    ? `<select id="nsz" title="Taille du texte"><option value="">Taille</option>${SZ.map(s => `<option value="${s[1]}">${s[0]}</option>`).join("")}</select>`
    : `<button type="button" data-n="${b[0]}" data-v="${b[3] || ""}" title="${b[2]}">${b[1]}</button>`).join("");
  return `<div class="tb">${bar}<span class="nst" id="nst">${n && n.maj ? "Dernière modification : " + new Date(n.maj).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" }) : ""}</span></div>
  <div id="ed" contenteditable="true" spellcheck="true">${clean(n && n.html)}</div>`;
}
function nCmd(c, v) {
  const ed = $("#ed"); if (!ed) return;
  ed.focus();
  if (rng) { const s = getSelection(); s.removeAllRanges(); s.addRange(rng); }
  if (c == "check") document.execCommand("insertHTML", false, '<input type="checkbox" class="tk">&nbsp;');
  else { document.execCommand("styleWithCSS", false, ["hiliteColor", "foreColor", "fontSize"].includes(c)); document.execCommand(c, false, v || null); }
  noteInput();
}
function noteInput() {
  const ed = $("#ed"), st = $("#nst"); if (!ed) return;
  const html = ed.innerHTML;
  if (html.length > 45000) { st.textContent = "⚠ Note trop longue pour être enregistrée : raccourcis-la"; return; }
  lastTyped = Date.now();
  let n = D.notes[0]; if (!n) { n = { id: "bloc" }; D.notes = [n]; }
  n.html = html; n.maj = new Date().toISOString();
  st.textContent = "Enregistrement…";
  clearTimeout(ntimer);
  ntimer = setTimeout(async () => {
    await save(); const s = $("#nst"); if (!s) return;
    s.textContent = diff().length ? "Enregistrement en cours…" : "Enregistré à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  }, 800);
}
document.addEventListener("selectionchange", () => { const s = getSelection(), ed = $("#ed"); if (ed && s.rangeCount && ed.contains(s.anchorNode)) rng = s.getRangeAt(0).cloneRange(); });
document.addEventListener("mousedown", e => { const b = e.target.closest(".tb [data-n]"); if (b) { e.preventDefault(); nCmd(b.dataset.n, b.dataset.v); } });
document.addEventListener("change", e => {
  if (e.target.id == "nsz") { if (e.target.value) nCmd("fontSize", e.target.value); e.target.value = ""; }
  else if (e.target.classList && e.target.classList.contains("tk")) { e.target.toggleAttribute("checked", e.target.checked); noteInput(); }
});
document.addEventListener("input", e => { if (e.target.id == "ed") noteInput(); });

document.addEventListener("click", e => { const l = e.target.closest(".filt>.ft"); if (l) { filOpen = !filOpen; l.parentNode.classList.toggle("open", filOpen); } });
$("#mnu").onclick = () => document.querySelector("header").classList.toggle("open");
document.querySelector(".tools").addEventListener("click", () => document.querySelector("header").classList.remove("open"));
window.addEventListener("beforeunload", e => { if (ready && (saving || diff().length)) { e.preventDefault(); e.returnValue = ""; } });
migrer();
if (ech(jours).length && D.dossiers.length) tab = "rap";
render();
initDb();
</script>
